name: AguaIA checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: uv sync --locked
      - run: uv run ruff check app tests migrations
      - run: uv run ruff format --check app tests migrations
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run python -m app.seed
      - run: uv run alembic check
      - run: uv run pytest -q -p no:cacheprovider --cov=app --cov-report=xml
      - run: uv run python ../scripts/evaluate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results-${{ matrix.os }}
          path: |
            backend/coverage.xml
            evals/results.json
            evals/results.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
