[project]
name = "aguaia"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1", "aiosqlite>=0.21,<1", "alembic>=1.14,<2",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "openai>=2,<3", "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
files = ["app/contracts.py", "app/domain.py", "app/config.py"]
check_untyped_defs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["app"]
